<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeYun 资源下载</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;color:#202936;background:#f4f6f9;margin:0;padding:48px 20px}
main{max-width:720px;margin:auto;background:white;padding:32px;border-radius:16px}
h1{font-size:26px;margin-top:0}input,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #ccd2da}
input{display:block;margin:12px 0;box-sizing:border-box;width:100%}button,a{color:#145dc2}
button{cursor:pointer;background:#f0f5ff}li{margin:20px 0;overflow-wrap:anywhere}small{color:#626d7b}
#status{color:#626d7b} [hidden]{display:none!important}
</style>
<main><h1 id="title">CodeYun 资源下载</h1><p>使用 code4101.com 的超管账号下载。</p>
<p id="status" role="status">正在检查登录状态…</p>
<form id="login" hidden><input name="username" placeholder="超管用户名" autocomplete="username" required>
<input name="password" type="password" placeholder="密码" autocomplete="current-password" required>
<button>登录并查看资源</button></form><ul id="files" hidden></ul></main>
<script>
const base=location.pathname.replace(/\/$/,''), status=document.querySelector('#status'), login=document.querySelector('#login');
async function establish(token){
  const r=await fetch('/api/admin-downloads/session',{method:'POST',headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error(r.status===401?'登录已过期，请重新登录。':'此账号没有超管下载权限。');
}
async function showFiles(){
  const r=await fetch(base+'/metadata');
  if(!r.ok)throw new Error(r.status===401?'请登录超管账号。':r.status===403?'此账号没有超管下载权限。':'下载资源不存在。');
  const data=await r.json();document.querySelector('#title').textContent=data.title;
  const list=document.querySelector('#files');list.replaceChildren();
  for(const file of data.files){
    const item=document.createElement('li'), link=document.createElement('a'), size=document.createElement('small');
    link.textContent=file.name;link.href=base+'/files/'+encodeURIComponent(file.name);link.download=file.name;
    size.textContent=' · '+(file.bytes/1024/1024).toFixed(1)+' MiB';item.append(link,size);list.append(item);
  }
  list.hidden=false;login.hidden=true;status.textContent='点击文件名下载；支持断点续传。';
}
login.addEventListener('submit',async e=>{
  e.preventDefault();const button=login.querySelector('button');button.disabled=true;status.textContent='正在登录…';
  try{
    const fields=new FormData(login);
    const r=await fetch('/api/auth/login/json',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:fields.get('username'),password:fields.get('password')})});
    login.elements.password.value='';if(!r.ok)throw new Error('登录失败，请检查账号和密码。');
    const data=await r.json();await establish(data.access_token);await showFiles();
  }catch(e){status.textContent=e.message;}finally{button.disabled=false;}
});
(async()=>{
  try{
    const token=localStorage.getItem('token');if(token)await establish(token);await showFiles();
  }catch(e){status.textContent=e.message;login.hidden=false;}
})();
</script></html>
