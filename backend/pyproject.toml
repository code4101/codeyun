[project]
name = "codeyun-backend"
version = "0.1.0"
description = "Local backend for CodeYun tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "chardet>=5.2.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "apscheduler>=3.10.0,<4.0.0",
    "DrissionPage>=4.1.1.2",
    "UnityPy>=1.25.0",
    "pyxllib[kq5034]",
    "beautifulsoup4>=4.14.3",
    "pillow>=10.0.0",
    "cryptography>=46.0.0",
    "websockets>=12.0",
    "opencv-python>=4.11.0.86 ; sys_platform == 'win32'",
    "opencv-python-headless>=4.11.0.86 ; sys_platform == 'linux'",
    "paddleocr>=3.4.0",
    "mcp>=1.27.0",
    "pypdf>=6.0.0",
    "pypinyin>=0.55.0",
    "jieba>=0.42.1",
    "akshare>=1.18.64",
    "adb-shell>=0.4.4",
    "rembg[cpu]>=2.0.69",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort"
]
ocr-cpu = [
    "paddlepaddle>=3.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
pyxllib = { path = "../../pyxllib", editable = true }
