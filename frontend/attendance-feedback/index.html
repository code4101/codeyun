<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考勤问题反馈表 - CodeYun</title>
    <style>
      :root {
        color: #2f2418;
        background: #fffdf8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        margin: 0;
        background: #fffdf8;
      }

      .public-feedback-loading {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #7d6850;
      }

      .public-feedback-loading__panel {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 320px;
      }

      .public-feedback-loading__mark {
        width: 26px;
        height: 26px;
        border: 2px solid #e2d7c7;
        border-top-color: #2e77f0;
        border-radius: 999px;
        animation: public-feedback-loading-spin 0.9s linear infinite;
      }

      .public-feedback-loading__title {
        margin: 0;
        color: #2f2418;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.35;
      }

      .public-feedback-loading__text {
        margin: 3px 0 0;
        font-size: 13px;
        line-height: 1.45;
      }

      @keyframes public-feedback-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="attendance-feedback-app">
      <div class="public-feedback-loading" role="status" aria-live="polite">
        <div class="public-feedback-loading__panel">
          <div class="public-feedback-loading__mark" aria-hidden="true"></div>
          <div>
            <p class="public-feedback-loading__title">正在打开反馈表</p>
            <p class="public-feedback-loading__text">正在加载问卷资源。</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/attendance-feedback/main.ts"></script>
  </body>
</html>
